port: 7890
socks-port: 7891
redir-port: 7892
tproxy-port: 7895
allow-lan: true
bind-address: '*'
mode: rule
log-level: info
ipv6: true
external-controller: 127.0.0.1:9090
profile:
  store-selected: true
  store-fake-ip: true
dns:
  enable: true
  listen: 0.0.0.0:7874
  ipv6: true
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
    - '*.lan'
    - '*.local'
    - localhost.ptlogin2.qq.com
    - +.msftconnecttest.com
    - +.msftncsi.com
  default-nameserver:
    - 114.114.114.114
  proxy-server-nameserver:
    - 114.114.114.114
  nameserver:
    - https://1.1.1.1/dns-query#🚀 手动选择
    - https://8.8.8.8/dns-query#🚀 手动选择
  nameserver-policy:
    rule-set:System_China,System_SteamCDN:
      - 114.114.114.114
sniffer:
  enable: true
  sniff:
    TLS:
      ports: [443, 8443]
    HTTP:
      ports: [80, 8080]
