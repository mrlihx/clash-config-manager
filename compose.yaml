services:
  manager:
    build: .
    restart: unless-stopped
    expose:
      - "8787"
    volumes:
      - ./config.production.yaml:/app/config.yaml:ro
      - manager-data:/app/data
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8787/api/session"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 30s
    stop_grace_period: 20s

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      manager:
        condition: service_healthy

volumes:
  manager-data:
  caddy-data:
  caddy-config:
