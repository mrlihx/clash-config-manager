<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clash 配置管理器</title>
  <link rel="stylesheet" href="/css/reference.css">
  <link rel="stylesheet" href="/css/native.css">
  <script type="module" src="/js/app.js"></script>
</head>
<body class="min-h-screen bg-slate-50 dark:bg-slate-950 text-slate-800 dark:text-slate-100 font-sans transition-colors duration-200">
  <section id="login" hidden>
    <div class="min-h-screen bg-slate-50 dark:bg-slate-950 flex flex-col justify-center items-center p-4 relative overflow-hidden transition-colors duration-200">
      <div class="absolute -top-32 -left-32 w-96 h-96 bg-primary-500/20 rounded-full blur-3xl pointer-events-none"></div>
      <div class="absolute -bottom-32 -right-32 w-96 h-96 bg-purple-500/20 rounded-full blur-3xl pointer-events-none"></div>
      <div class="absolute top-6 right-6 flex items-center gap-3" id="loginTheme"></div>
      <div class="w-full max-w-md p-8 sm:p-10 rounded-3xl bg-white/85 dark:bg-slate-900/85 backdrop-blur-xl border border-slate-200/80 dark:border-slate-800 shadow-2xl relative z-10 space-y-6">
        <div class="text-center space-y-2">
          <div id="loginLogo" class="inline-flex h-12 w-12 rounded-2xl bg-primary-600 text-white items-center justify-center shadow-lg shadow-primary-500/30 mb-2"></div>
          <h1 class="text-2xl font-black text-slate-900 dark:text-slate-100 tracking-tight">Clash 配置管理器</h1>
          <p class="text-xs text-slate-500 dark:text-slate-400">登录管理节点、规则和订阅</p>
        </div>
        <form id="loginForm" class="space-y-4">
          <div id="loginField"></div>
          <p id="loginError" role="alert" class="text-xs text-rose-600 dark:text-rose-400" hidden></p>
          <div id="loginSubmit"></div>
        </form>
      </div>
    </div>
  </section>

  <div id="app" hidden>
    <header id="header" class="fixed top-0 inset-x-0 h-16 z-50 transition-all duration-200">
      <div class="px-4 sm:px-6 lg:px-8 h-full flex items-center justify-between">
        <div class="flex items-center gap-3">
          <button type="button" data-action="sidebar" class="lg:hidden p-2 rounded-xl transition-colors" title="切换侧边栏" aria-controls="sidebar" aria-expanded="false"></button>
          <a href="#profiles" class="flex items-center gap-2.5 group select-none">
            <div id="brandLogo" class="h-9 w-9 rounded-xl flex items-center justify-center text-white shadow-md transition-all duration-300 group-hover:scale-105 bg-primary-600"></div>
            <span class="font-bold text-base transition-colors group-hover:text-primary-600">Clash 配置管理器</span>
            <span class="hidden sm:inline-block px-1.5 py-0.5 text-[10px] font-semibold rounded-md border bg-primary-50 text-primary-600 dark:bg-primary-950/60 dark:text-primary-400 border-primary-200 dark:border-primary-800/80">v1.0.0</span>
          </a>
        </div>
        <div id="headerControls" class="flex items-center gap-2 sm:gap-3"></div>
      </div>
    </header>
    <button id="sidebarOverlay" data-action="sidebar" aria-label="关闭侧边栏" class="fixed inset-0 z-30 bg-slate-900/60 lg:hidden" hidden></button>
    <div class="flex-1 flex w-full pt-16 min-h-screen">
      <aside id="sidebar" class="fixed top-16 bottom-0 left-0 z-40 w-64 flex flex-col transition-all duration-300 ease-in-out lg:translate-x-0 -translate-x-full">
        <nav id="navigation" class="flex-1 overflow-y-auto px-4 py-6 space-y-6" aria-label="后台导航"></nav>
        <div class="p-4 border-t border-slate-100 dark:border-slate-800 bg-slate-50/50 dark:bg-slate-950/50">
          <div class="p-3 rounded-xl bg-gradient-to-r from-primary-500/10 via-purple-500/10 to-pink-500/10 border border-primary-200/40 dark:border-primary-800/40">
            <p class="text-xs font-semibold text-primary-900 dark:text-primary-200">Mihomo 配置</p>
            <p class="text-[11px] text-slate-500 dark:text-slate-400 leading-snug">管理 OpenClash 节点、策略组和分流。</p>
          </div>
        </div>
      </aside>
      <main class="flex-1 min-w-0 flex flex-col lg:pl-64">
        <div id="content" class="flex-1 p-4 sm:p-6 lg:p-8 w-full"></div>
        <footer class="border-t border-slate-200/80 dark:border-slate-800/80 py-6 px-4 text-center text-xs text-slate-400 mt-auto">Clash 配置管理器 · OpenClash / Mihomo</footer>
      </main>
    </div>
  </div>
  <dialog id="modal" aria-labelledby="modalTitle" class="bg-transparent max-w-2xl w-full p-4 text-slate-800 dark:text-slate-100">
    <form id="modalForm" class="w-full bg-white dark:bg-slate-900 rounded-2xl shadow-2xl border border-slate-200 dark:border-slate-800 overflow-hidden flex flex-col">
      <div class="px-6 py-4 border-b border-slate-100 dark:border-slate-800 flex items-center justify-between">
        <div>
          <h2 id="modalTitle" class="text-lg font-semibold text-slate-900 dark:text-slate-100"></h2>
          <p id="modalDescription" class="text-xs text-slate-500 dark:text-slate-400 mt-0.5"></p>
        </div>
        <button type="button" data-action="close-modal" aria-label="关闭" class="p-1 rounded-lg text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors"></button>
      </div>
      <div id="modalBody" class="p-6 overflow-y-auto max-h-[70vh] space-y-4"></div>
      <p id="modalError" role="alert" class="px-6 pb-4 whitespace-pre-wrap text-xs text-rose-600 dark:text-rose-400" hidden></p>
      <div id="modalFooter" class="px-6 py-3.5 bg-slate-50/80 dark:bg-slate-900/80 border-t border-slate-100 dark:border-slate-800 flex items-center justify-end gap-3"></div>
    </form>
  </dialog>
  <div id="toasts" class="space-y-2" aria-live="polite"></div>
</body>
</html>
