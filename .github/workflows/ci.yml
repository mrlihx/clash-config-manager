name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: go test ./...
      - run: go vet ./...
      - run: bash -n deploy/install.sh
      - run: sh -n deploy/entrypoint.sh
      - name: Check JavaScript syntax
        run: for file in web/js/*.js web/js/build/*.js; do node --check "$file"; done
      - run: go build -trimpath -o bin/clash-config-manager ./cmd/app
